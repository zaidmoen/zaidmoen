<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Technical toolkit</title><desc id="desc">Tools used across backend, data, AI and software workflow.</desc><defs><radialGradient id="wash" cx=".82" cy=".12" r=".85"><stop stop-color="#232B52" stop-opacity=".48"/><stop offset="1" stop-color="#0B0F14" stop-opacity="0"/></radialGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#526078" opacity=".30"/></pattern><linearGradient id="sweep"><stop stop-color="#9AA7FF" stop-opacity="0"/><stop offset=".5" stop-color="#B9C4FF"/><stop offset="1" stop-color="#9AA7FF" stop-opacity="0"/></linearGradient><clipPath id="terminalclip"><rect x="0" y="0" width="1200" height="550" rx="12"/></clipPath><style>
.cursor{animation:blink 1.15s step-end infinite}
.packet{stroke-dasharray:7 155;animation:flow 4s linear infinite}
.packet2{stroke-dasharray:7 155;animation:flow 4.8s -1.7s linear infinite}
.signal{animation:pulse 3s ease-in-out infinite}
.reveal{animation:show .65s ease-out both}
.reveal2{animation:show .65s .15s ease-out both}
.reveal3{animation:show .65s .3s ease-out both}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-162}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cursor,.packet,.packet2,.signal,.reveal,.reveal2,.reveal3{animation:none!important}}
</style></defs><rect x="0.5" y="0.5" width="1199" height="259" rx="12" fill="#0B0F14" stroke="#242D3A"/><text x="28" y="36" fill="#4FD1C5" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >❯</text><text x="52" y="36" fill="#9AA7FF" font-size="15" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >stack --list</text><path d="M26 52H1174" stroke="#242D3A" fill="none" /><text x="28" y="83" fill="#9AA7FF" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >--primary</text><text x="28" y="108" fill="#F5F7FA" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Python / Django / FastAPI</text><text x="28" y="130" fill="#98A2B3" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" >React / TypeScript / C++</text><text x="604" y="83" fill="#9AA7FF" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >--data</text><text x="604" y="108" fill="#F5F7FA" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif" >PostgreSQL / MySQL</text><text x="604" y="130" fill="#98A2B3" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Supabase / SQL</text><text x="28" y="174" fill="#9AA7FF" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >--intelligence</text><text x="28" y="199" fill="#F5F7FA" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif" >scikit-learn / OpenCV</text><text x="28" y="221" fill="#98A2B3" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" >MediaPipe / Information Retrieval</text><text x="604" y="174" fill="#9AA7FF" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >--workflow</text><text x="604" y="199" fill="#F5F7FA" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Git / GitHub / REST APIs</text><text x="604" y="221" fill="#98A2B3" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" >System Design / Automation</text></svg>
