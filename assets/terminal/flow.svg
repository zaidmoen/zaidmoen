<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc"><title id="title">APEX FlowGuard</title><desc id="desc">Leak detection &amp; hydraulic decision support</desc><defs><radialGradient id="wash" cx=".82" cy=".12" r=".85"><stop stop-color="#232B52" stop-opacity=".48"/><stop offset="1" stop-color="#0B0F14" stop-opacity="0"/></radialGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#526078" opacity=".30"/></pattern><linearGradient id="sweep"><stop stop-color="#9AA7FF" stop-opacity="0"/><stop offset=".5" stop-color="#B9C4FF"/><stop offset="1" stop-color="#9AA7FF" stop-opacity="0"/></linearGradient><clipPath id="terminalclip"><rect x="0" y="0" width="1200" height="550" rx="12"/></clipPath><style>
.cursor{animation:blink 1.15s step-end infinite}
.packet{stroke-dasharray:7 155;animation:flow 4s linear infinite}
.packet2{stroke-dasharray:7 155;animation:flow 4.8s -1.7s linear infinite}
.signal{animation:pulse 3s ease-in-out infinite}
.reveal{animation:show .65s ease-out both}
.reveal2{animation:show .65s .15s ease-out both}
.reveal3{animation:show .65s .3s ease-out both}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-162}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cursor,.packet,.packet2,.signal,.reveal,.reveal2,.reveal3{animation:none!important}}
</style></defs><rect x="0.5" y="0.5" width="1199" height="159" rx="12" fill="#0B0F14" stroke="#242D3A"/><text x="26" y="30" fill="#98A2B3" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >01</text><text x="61" y="30" fill="#4FD1C5" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >❯</text><text x="85" y="30" fill="#9AA7FF" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >open apex-flowguard</text><text x="1175" y="30" fill="#4FD1C5" font-size="11" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="end">PROTOTYPE</text><path d="M24 46H1176" stroke="#242D3A" fill="none" /><text x="25" y="94" fill="#F5F7FA" font-size="38" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1">APEX FlowGuard</text><text x="26" y="125" fill="#98A2B3" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Leak detection &amp; hydraulic decision support</text><path d="M796 63V137" stroke="#242D3A" fill="none" /><text x="821" y="84" fill="#98A2B3" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >ENVIRONMENTAL TECH</text><text x="821" y="113" fill="#9AA7FF" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >Python / FastAPI / React / WNTR</text><text x="1171" y="127" fill="#F5F7FA" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">↗</text></svg>
