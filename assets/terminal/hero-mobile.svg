<svg xmlns="http://www.w3.org/2000/svg" width="640" height="792" viewBox="0 0 640 792" role="img" aria-labelledby="title desc"><title id="title">Zaid Mayyalleh — Building what comes next.</title><desc id="desc">Terminal-inspired identity with animated cursor and system map. Backend engineering, applied intelligence and system design.</desc><defs><radialGradient id="wash" cx=".82" cy=".12" r=".85"><stop stop-color="#232B52" stop-opacity=".48"/><stop offset="1" stop-color="#0B0F14" stop-opacity="0"/></radialGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#526078" opacity=".30"/></pattern><linearGradient id="sweep"><stop stop-color="#9AA7FF" stop-opacity="0"/><stop offset=".5" stop-color="#B9C4FF"/><stop offset="1" stop-color="#9AA7FF" stop-opacity="0"/></linearGradient><clipPath id="terminalclip"><rect x="0" y="0" width="1200" height="550" rx="12"/></clipPath><style>
.cursor{animation:blink 1.15s step-end infinite}
.packet{stroke-dasharray:7 155;animation:flow 4s linear infinite}
.packet2{stroke-dasharray:7 155;animation:flow 4.8s -1.7s linear infinite}
.signal{animation:pulse 3s ease-in-out infinite}
.reveal{animation:show .65s ease-out both}
.reveal2{animation:show .65s .15s ease-out both}
.reveal3{animation:show .65s .3s ease-out both}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-162}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cursor,.packet,.packet2,.signal,.reveal,.reveal2,.reveal3{animation:none!important}}
