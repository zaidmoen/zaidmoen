<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-labelledby="title desc"><title id="title">NAI AI Hub</title><desc id="desc">AI resource discovery, model arena &amp; learning paths</desc><defs><radialGradient id="wash" cx=".82" cy=".12" r=".85"><stop stop-color="#232B52" stop-opacity=".48"/><stop offset="1" stop-color="#0B0F14" stop-opacity="0"/></radialGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#526078" opacity=".30"/></pattern><linearGradient id="sweep"><stop stop-color="#9AA7FF" stop-opacity="0"/><stop offset=".5" stop-color="#B9C4FF"/><stop offset="1" stop-color="#9AA7FF" stop-opacity="0"/></linearGradient><clipPath id="terminalclip"><rect x="0" y="0" width="1200" height="550" rx="12"/></clipPath><style>
.cursor{animation:blink 1.15s step-end infinite}
.packet{stroke-dasharray:7 155;animation:flow 4s linear infinite}
.packet2{stroke-dasharray:7 155;animation:flow 4.8s -1.7s linear infinite}
.signal{animation:pulse 3s ease-in-out infinite}
.reveal{animation:show .65s ease-out both}
.reveal2{animation:show .65s .15s ease-out both}
.reveal3{animation:show .65s .3s ease-out both}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-162}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cursor,.packet,.packet2,.signal,.reveal,.reveal2,.reveal3{animation:none!important}}
</style></defs><rect x="0.5" y="0.5" width="639" height="229" rx="12" fill="#0B0F14" stroke="#242D3A"/><text x="26" y="30" fill="#98A2B3" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >03</text><text x="61" y="30" fill="#4FD1C5" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >❯</text><text x="85" y="30" fill="#9AA7FF" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >open nai-ai-hub</text><text x="615" y="30" fill="#4FD1C5" font-size="11" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="end">WEB APP</text><path d="M24 46H616" stroke="#242D3A" fill="none" /><text x="24" y="90" fill="#F5F7FA" font-size="38" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1">NAI AI Hub</text><text x="25" y="126" fill="#98A2B3" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif" >AI resource discovery, model arena &amp;</text><text x="25" y="150" fill="#98A2B3" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif" >learning paths</text><path d="M24 178H616" stroke="#242D3A" fill="none" /><text x="25" y="206" fill="#9AA7FF" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >React / TypeScript / Vite</text><text x="615" y="206" fill="#F5F7FA" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">↗</text></svg>
