<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="248" viewBox="0 0 1120 248" role="img" aria-labelledby="title desc">
  <title id="title">Current focus: Apex Intelligence</title>
  <desc id="desc">A student-led engineering community focused on problem solving, product building, and shared momentum.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1c31"/>
      <stop offset="0.56" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54a8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#62d9ff"/>
      <stop offset="1" stop-color="#54a8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#43c8ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#43c8ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 1014px 48px; }
      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes scan { 0%, 100% { transform: translateX(-180px); opacity: 0; } 22%, 72% { opacity: .7; } 92% { transform: translateX(1120px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .scan { animation: none; } .pulse { opacity: .85; } .scan { opacity: 0; } }
    </style>
  </defs>
  <rect width="1120" height="248" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="246" rx="19" fill="none" stroke="#294a70"/>
  <circle cx="1014" cy="48" r="122" fill="url(#glow)"/>
  <path d="M38 205H1082" stroke="#1c3856"/>
  <path class="scan" d="M40 205H1080" stroke="url(#line)" stroke-width="2"/>
  <text x="40" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#76c2ff" font-weight="600" letter-spacing="2.4">CURRENT FOCUS  /  01</text>
  <circle class="pulse" cx="1014" cy="48" r="6" fill="#63d9ff"/>
  <circle cx="1014" cy="48" r="13" fill="none" stroke="#63d9ff" stroke-opacity=".45"/>
  <text x="40" y="105" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" fill="#f1f7ff" font-weight="700">Apex Intelligence</text>
  <text x="42" y="140" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#b4c9df">A student-led engineering community for problem solving, product building,</text>
  <text x="42" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#b4c9df">and shared momentum.</text>
  <text x="40" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#87a9cb" font-weight="600" letter-spacing="1.6">COMMUNITY  /  PLATFORM  /  PROBLEM SOLVING</text>
  <g transform="translate(938 94)" fill="none" stroke="#5dbfff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M0 31L30 0L60 31L30 62Z"/>
    <path d="M30 0V62M0 31H60" opacity=".5"/>
    <circle cx="0" cy="31" r="4" fill="#5dbfff"/><circle cx="30" cy="0" r="4" fill="#5dbfff"/><circle cx="60" cy="31" r="4" fill="#5dbfff"/><circle cx="30" cy="62" r="4" fill="#5dbfff"/>
  </g>
</svg>
