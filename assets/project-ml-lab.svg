<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Bank Marketing ML Lab</title>
  <desc id="desc">An end-to-end multiclass machine learning study with clustering, classification, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120915"/><stop offset="1" stop-color="#29102e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f08cff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e59aff" stroke-opacity=".04"/></pattern>
    <style>.overline{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2.1px}.title{font:800 30px 'Segoe UI',Arial,sans-serif;letter-spacing:-.4px}.sub{font:500 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}.micro{font:500 9px Consolas,monospace;letter-spacing:1.2px}.pulse{animation:p 3.1s ease-in-out infinite}@keyframes p{50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="638" height="238" rx="20" fill="url(#bg)" stroke="#f08cff" stroke-opacity=".2"/>
  <rect x="1" y="1" width="638" height="238" rx="20" fill="url(#grid)"/>
  <path d="M32 34H145" stroke="url(#accent)" stroke-width="3"/>
  <text x="32" y="62" class="overline" fill="#d9a2e6">04 / APPLIED MACHINE LEARNING</text>
  <text x="32" y="113" class="title" fill="#fff4ff">BANK ML LAB</text>
  <text x="32" y="143" class="sub" fill="#c6abc9">CLASSIFY · COMPARE · EVALUATE</text>
  <text x="32" y="202" class="micro" fill="#8e6e94">SCIKIT-LEARN  ·  JUPYTER  ·  CV</text>
  <g transform="translate(500 119)">
    <path d="M-92 67V-69M-92 67H101" stroke="#d9a2e6" stroke-opacity=".24"/>
    <path d="M-80 45C-35 30-34-2 0-9S47 10 88-50" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <g fill="#f08cff" filter="url(#glow)"><circle cx="-70" cy="39" r="4"/><circle cx="-44" cy="21" r="4" class="pulse"/><circle cx="-12" cy="-4" r="4"/><circle cx="18" cy="-5" r="4" class="pulse"/><circle cx="49" cy="0" r="4"/><circle cx="82" cy="-42" r="4" class="pulse"/></g>
    <g fill="#a78bfa" fill-opacity=".62"><circle cx="-58" cy="-25" r="4"/><circle cx="-20" cy="36" r="4"/><circle cx="21" cy="24" r="4"/><circle cx="61" cy="39" r="4"/><circle cx="80" cy="15" r="4"/></g>
    <path d="M-22-58L9-37L42-65" fill="none" stroke="#a78bfa" stroke-opacity=".42" stroke-dasharray="4 5"/><circle cx="-22" cy="-58" r="3" fill="#cebaff"/><circle cx="9" cy="-37" r="3" fill="#cebaff"/><circle cx="42" cy="-65" r="3" fill="#cebaff"/>
  </g>
</svg>
