<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Zaid Mayyalleh — Software Engineer</title>
  <desc id="desc">GitHub profile header for Zaid Mayyalleh, focused on backend engineering, full-stack development, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.55" stop-color="#111114"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="0" x2="1118" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11D48"/>
      <stop offset="0.52" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#27272A" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="18" fill="url(#grid)" opacity=".34"/>
  <circle cx="1038" cy="82" r="112" fill="#E11D48" opacity=".08" filter="url(#glow)"/>
  <circle cx="1088" cy="428" r="128" fill="#22C55E" opacity=".05" filter="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="518" rx="17" fill="none" stroke="#2B2B30"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="55" font-size="12" font-weight="700" fill="#A1A1AA" letter-spacing="2.8">ZAID MAYYALLEH  /  ENGINEERING PROFILE</text>
    <circle cx="1012" cy="50" r="5" fill="#22C55E"/>
    <text x="1028" y="55" font-size="11" font-weight="700" fill="#D4D4D8" letter-spacing="1.6">PALESTINE</text>
    <rect x="74" y="77" width="1044" height="2" rx="1" fill="url(#accent)" opacity=".95"/>

    <text x="74" y="149" font-size="15" font-weight="700" fill="#FB7185" letter-spacing="2.1">BACKEND ENGINEERING  ·  FULL-STACK  ·  APPLIED AI</text>
    <text x="68" y="260" font-size="103" font-weight="800" fill="#FAFAFA" letter-spacing="-5">Zaid</text>
    <text x="70" y="339" font-size="71" font-weight="750" fill="#E4E4E7" letter-spacing="-3">Mayyalleh</text>

    <text x="74" y="383" font-size="20" font-weight="500" fill="#A1A1AA">Computer Science student building useful systems, clean APIs,</text>
    <text x="74" y="412" font-size="20" font-weight="500" fill="#A1A1AA">and product-minded software that moves from idea to working code.</text>

    <rect x="74" y="449" width="123" height="34" rx="17" fill="#18181B" stroke="#3F3F46"/>
    <text x="94" y="471" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing=".8">PYTHON</text>
    <rect x="207" y="449" width="121" height="34" rx="17" fill="#18181B" stroke="#3F3F46"/>
    <text x="228" y="471" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing=".8">FASTAPI</text>
    <rect x="338" y="449" width="121" height="34" rx="17" fill="#18181B" stroke="#3F3F46"/>
    <text x="359" y="471" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing=".8">DJANGO</text>
    <rect x="469" y="449" width="111" height="34" rx="17" fill="#18181B" stroke="#3F3F46"/>
    <text x="491" y="471" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing=".8">REACT</text>
    <rect x="590" y="449" width="135" height="34" rx="17" fill="#18181B" stroke="#3F3F46"/>
    <text x="612" y="471" font-size="12" font-weight="700" fill="#FAFAFA" letter-spacing=".8">APPLIED AI</text>

    <g>
      <rect x="794" y="126" width="324" height="286" rx="20" fill="url(#card)" stroke="#323238"/>
      <text x="824" y="161" font-size="11" font-weight="700" fill="#71717A" letter-spacing="2.2">CURRENT FOCUS</text>

      <circle cx="829" cy="199" r="4" fill="#E11D48"/>
      <text x="846" y="204" font-size="16" font-weight="700" fill="#F4F4F5">Backend systems</text>
      <text x="846" y="224" font-size="12" fill="#8B8B94">APIs · auth · data · architecture</text>

      <circle cx="829" cy="260" r="4" fill="#FB7185"/>
      <text x="846" y="265" font-size="16" font-weight="700" fill="#F4F4F5">Full-stack products</text>
      <text x="846" y="285" font-size="12" fill="#8B8B94">From interface to persistence</text>

      <circle cx="829" cy="321" r="4" fill="#22C55E"/>
      <text x="846" y="326" font-size="16" font-weight="700" fill="#F4F4F5">Applied AI</text>
      <text x="846" y="346" font-size="12" fill="#8B8B94">Computer vision · ML experiments</text>

      <path d="M824 368H1088" stroke="#2F2F34"/>
      <text x="824" y="393" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="1.2">BUILDING  APEX INTELLIGENCE</text>
    </g>
  </g>
</svg>