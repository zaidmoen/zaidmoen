<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="594" viewBox="0 0 1200 594" role="img" aria-labelledby="title desc"><title id="title">Zaid Mayyalleh — Backend engineering and applied AI</title><desc id="desc">Personal identity in charcoal and champagne gold. A geometric ZM monogram accompanies the name and the statement: Thoughtful systems. Built with intent.</desc><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8E774E"/><stop offset=".45" stop-color="#E9D7AF"/><stop offset="1" stop-color="#AD9464"/></linearGradient></defs><rect x="0" y="0" width="1200" height="594" fill="#101214" stroke="none"/><g transform="translate(48 27) scale(0.3)" fill="none" stroke="#CDB583" stroke-width="10" stroke-linejoin="miter"><path d="M0 0H68L0 74H68"/><path d="M88 74V0L126 40 164 0V74"/></g><text x="117" y="44" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#F3F0E9" font-weight="500" letter-spacing="2">ZAID MAYYALLEH</text><text text-anchor="end" x="1152" y="44" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#A7A9AA" font-weight="500" letter-spacing="2">PALESTINE</text><path d="M48 72H1152" fill="none" stroke="#34383B" stroke-width="1"/><text x="48" y="128" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CDB583" font-weight="500" letter-spacing="2">BACKEND ENGINEERING / APPLIED AI</text><text x="43" y="240" font-family="Arial,Helvetica,sans-serif" font-size="113" fill="#F3F0E9" font-weight="700" letter-spacing="-5">Zaid</text><text x="43" y="342" font-family="Arial,Helvetica,sans-serif" font-size="100" fill="#F3F0E9" font-weight="700" letter-spacing="-5">Mayyalleh</text><rect x="48" y="373" width="64" height="3" fill="#CDB583" stroke="none"/><text x="48" y="420" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#F3F0E9" font-weight="400" >Thoughtful systems.</text><text x="48" y="458" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#A7A9AA" font-weight="400" >Built with