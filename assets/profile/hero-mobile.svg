<svg xmlns="http://www.w3.org/2000/svg" width="600" height="902" viewBox="0 0 600 902" role="img" aria-labelledby="title desc"><title id="title">Zaid Mayyalleh — Backend engineering and applied AI</title><desc id="desc">Personal identity in charcoal and champagne gold. A geometric ZM monogram accompanies the name and the statement: Thoughtful systems. Built with intent.</desc><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8E774E"/><stop offset=".45" stop-color="#E9D7AF"/><stop offset="1" stop-color="#AD9464"/></linearGradient></defs><rect x="0" y="0" width="600" height="902" fill="#101214" stroke="none"/><g transform="translate(32 27) scale(0.3)" fill="none" stroke="#CDB583" stroke-width="10" stroke-linejoin="miter"><path d="M0 0H68L0 74H68"/><path d="M88 74V0L126 40 164 0V74"/></g><text x="101" y="44" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#F3F0E9" font-weight="500" letter-spacing="2">ZAID MAYYALLEH</text><text text-anchor="end" x="568" y="44" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#A7A9AA" font-weight="500" letter-spacing="2">PALESTINE</text><path d="M32 72H568" fill="none" stroke="#34383B" stroke-width="1"/><text x="32" y="118" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#CDB583" font-weight="500" letter-spacing="2">BACKEND ENGINEERING / APPLIED AI</text><text x="27" y="204" font-family="Arial,Helvetica,sans-serif" font-size="92" fill="#F3F0E9" font-weight="700" letter-spacing="-5">Zaid</text><text x="27" y="288" font-family="Arial,Helvetica,sans-serif" font-size="78" fill="#F3F0E9" font-weight="700" letter-spacing="-5">Mayyalleh</text><rect x="32" y="316" width="64" height="3" fill="#CDB583" stroke="none"/><text x="32" y="358" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#F3F0E9" font-weight="400" >Thoughtful systems.</text><text x="32" y="393" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#A7A9AA" font-weight="400" >Built with intent