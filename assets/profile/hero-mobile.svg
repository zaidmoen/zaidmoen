<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Zaid Mayyalleh — Software Engineer</title>
  <desc id="desc">Mobile GitHub profile header for Zaid Mayyalleh, focused on backend engineering, full-stack development, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset=".56" stop-color="#111114"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11D48"/>
      <stop offset=".55" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#27272A" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>

  <rect width="600" height="760" rx="18" fill="url(#bg)"/>
  <rect width="600" height="760" rx="18" fill="url(#grid)" opacity=".32"/>
  <rect x="1" y="1" width="598" height="758" rx="17" fill="none" stroke="#2B2B30"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="40" y="48" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="2.1">ZAID MAYYALLEH / PROFILE</text>
    <circle cx="465" cy="44" r="5" fill="#22C55E"/>
    <text x="480" y="48" font-size="10" font-weight="700" fill="#D4D4D8" letter-spacing="1.2">PALESTINE</text>
    <rect x="40" y="69" width="520" height="2" rx="1" fill="url(#accent)"/>

    <text x="40" y="115" font-size="12" font-weight="700" fill="#FB7185" letter-spacing="1.6">BACKEND · FULL-STACK · APPLIED AI</text>
    <text x="36" y="213" font-size="86" font-weight="800" fill="#FAFAFA" letter-spacing="-4">Zaid</text>
    <text x="38" y="280" font-size="58" font-weight="750" fill="#E4E4E7" letter-spacing="-2.8">Mayyalleh</text>

    <text x="40" y="324" font-size="17" font-weight="500" fill="#A1A1AA">Computer Science student building useful systems,</text>
    <text x="40" y="349" font-size="17" font-weight="500" fill="#A1A1AA">clean APIs, and product-minded software.</text>

    <rect x="40" y="387" width="520" height="238" rx="20" fill="#141416" stroke="#323238"/>
    <text x="66" y="420" font-size="10" font-weight="700" fill="#71717A" letter-spacing="2">CURRENT FOCUS</text>

    <circle cx="70" cy="457" r="4" fill="#E11D48"/>
    <text x="88" y="462" font-size="15" font-weight="700" fill="#F4F4F5">Backend systems</text>
    <text x="88" y="481" font-size="11" fill="#8B8B94">APIs · auth · data · architecture</text>

    <circle cx="70" cy="519" r="4" fill="#FB7185"/>
    <text x="88" y="524" font-size="15" font-weight="700" fill="#F4F4F5">Full-stack products</text>
    <text x="88" y="543" font-size="11" fill="#8B8B94">From interface to persistence</text>

    <circle cx="70" cy="581" r="4" fill="#22C55E"/>
    <text x="88" y="586" font-size="15" font-weight="700" fill="#F4F4F5">Applied AI</text>
    <text x="88" y="605" font-size="11" fill="#8B8B94">Computer vision · ML experiments</text>

    <text x="40" y="668" font-size="10" font-weight="700" fill="#71717A" letter-spacing="1.8">CORE TOOLKIT</text>
    <rect x="40" y="687" width="86" height="32" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="57" y="708" font-size="11" font-weight="700" fill="#FAFAFA">PYTHON</text>
    <rect x="136" y="687" width="92" height="32" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="154" y="708" font-size="11" font-weight="700" fill="#FAFAFA">FASTAPI</text>
    <rect x="238" y="687" width="90" height="32" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="256" y="708" font-size="11" font-weight="700" fill="#FAFAFA">DJANGO</text>
    <rect x="338" y="687" width="80" height="32" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="357" y="708" font-size="11" font-weight="700" fill="#FAFAFA">REACT</text>
    <rect x="428" y="687" width="132" height="32" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="449" y="708" font-size="11" font-weight="700" fill="#FAFAFA">APPLIED AI</text>
