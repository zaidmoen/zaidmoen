<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Zaid Mayyalleh — Engineering with purpose</title>
  <desc id="desc">A dark, modern portfolio banner connecting product, systems, intelligence, and delivery around Zaid's initials.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.52" stop-color="#07131f"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <radialGradient id="aura" cx="78%" cy="48%" r="46%">
      <stop offset="0" stop-color="#19d3c5" stop-opacity="0.15"/>
      <stop offset="0.46" stop-color="#2385ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050912" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de2e6"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de2e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2de2e6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ca3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1438" height="418" rx="28"/></clipPath>
    <style>
      .eyebrow { font: 600 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; }
      .name { font: 800 64px 'Segoe UI', Arial, sans-serif; letter-spacing: -1.5px; }
      .role { font: 500 19px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.7px; }
      .statement { font: 400 18px 'Segoe UI', Arial, sans-serif; }
      .pill { font: 600 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.4px; }
      .node-label { font: 600 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.7px; }
      .micro { font: 500 10px 'SFMono-Regular', Consolas, monospace; letter-spacing: 1.5px; }
      .orbit { animation: orbit 20s linear infinite; transform-origin: 1175px 211px; }
      .dash { animation: dash 8s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-late { animation: pulse 3.2s 1.1s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .dash, .pulse, .pulse-late { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1440" height="420" fill="url(#background)"/>
    <rect width="1440" height="420" fill="url(#grid)"/>
    <rect width="1440" height="420" fill="url(#aura)"/>

    <path d="M-30 365C245 315 410 430 655 366S1010 303 1470 366" fill="none" stroke="url(#accentFade)" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M-20 383C250 333 414 447 660 383S1015 320 1470 383" fill="none" stroke="#2de2e6" stroke-opacity="0.06" stroke-width="1"/>

    <g transform="translate(82 64)">
      <circle cx="6" cy="6" r="5" fill="#2de2e6" filter="url(#glow)" class="pulse"/>
      <text x="22" y="11" class="eyebrow" fill="#8ca3b8">ZAID / PORTFOLIO 2026</text>

      <text x="0" y="114" class="name" fill="#f4f8fb">ZAID MAYYALLEH</text>
      <rect x="0" y="135" width="82" height="4" rx="2" fill="url(#accent)"/>
      <text x="0" y="177" class="role" fill="#b8c7d5">FULL-STACK ENGINEERING × INTELLIGENT SYSTEMS</text>
      <text x="0" y="216" class="statement" fill="#7f95a8">I turn real problems into reliable, thoughtful products.</text>

      <g transform="translate(0 252)">
        <rect width="136" height="34" rx="17" fill="#0c2230" stroke="#2de2e6" stroke-opacity="0.34"/>
        <text x="68" y="22" text-anchor="middle" class="pill" fill="#76f4ed">PRODUCT</text>
        <rect x="148" width="136" height="34" rx="17" fill="#0c2230" stroke="#2de2e6" stroke-opacity="0.24"/>
        <text x="216" y="22" text-anchor="middle" class="pill" fill="#9bb3c6">SYSTEMS</text>
        <rect x="296" width="168" height="34" rx="17" fill="#0c2230" stroke="#4f8cff" stroke-opacity="0.34"/>
        <text x="380" y="22" text-anchor="middle" class="pill" fill="#a9c7ff">INTELLIGENCE</text>
      </g>
    </g>

    <g>
      <path d="M1175 211L1040 104M1175 211L1315 103M1175 211L1322 317M1175 211L1032 320" stroke="#668096" stroke-opacity="0.3" stroke-width="1.5"/>
      <path d="M1040 104L1315 103L1322 317L1032 320Z" fill="none" stroke="#476176" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="7 10" class="dash"/>

      <circle cx="1175" cy="211" r="114" fill="none" stroke="#4f8cff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="5 13" class="orbit"/>
      <circle cx="1175" cy="211" r="78" fill="#081d2a" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="1175" cy="211" r="62" fill="#06131f" stroke="#b7fff9" stroke-opacity="0.13"/>
      <text x="1175" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-2" fill="#f4f8fb">ZM</text>
      <circle cx="1175" cy="211" r="4" fill="#2de2e6" filter="url(#glow)" class="pulse-late"/>

      <g>
        <circle cx="1040" cy="104" r="25" fill="#071722" stroke="#2de2e6" stroke-opacity="0.45"/>
        <circle cx="1040" cy="104" r="4" fill="#2de2e6" class="pulse"/>
        <text x="1040" y="71" text-anchor="middle" class="node-label" fill="#7f95a8">PRODUCT</text>

        <circle cx="1315" cy="103" r="25" fill="#071722" stroke="#4f8cff" stroke-opacity="0.5"/>
        <circle cx="1315" cy="103" r="4" fill="#4f8cff" class="pulse-late"/>
        <text x="1315" y="70" text-anchor="middle" class="node-label" fill="#7f95a8">INTELLIGENCE</text>

        <circle cx="1322" cy="317" r="25" fill="#071722" stroke="#2de2e6" stroke-opacity="0.4"/>
        <circle cx="1322" cy="317" r="4" fill="#2de2e6" class="pulse"/>
        <text x="1322" y="356" text-anchor="middle" class="node-label" fill="#7f95a8">DELIVERY</text>

        <circle cx="1032" cy="320" r="25" fill="#071722" stroke="#4f8cff" stroke-opacity="0.45"/>
        <circle cx="1032" cy="320" r="4" fill="#4f8cff" class="pulse-late"/>
        <text x="1032" y="359" text-anchor="middle" class="node-label" fill="#7f95a8">SYSTEMS</text>
      </g>
    </g>

    <g transform="translate(1110 24)">
      <rect width="278" height="30" rx="15" fill="#071722" stroke="#2de2e6" stroke-opacity="0.2"/>
      <circle cx="16" cy="15" r="4" fill="#38e8ae" class="pulse"/>
      <text x="30" y="19" class="micro" fill="#8ca3b8">BUILDING FROM PALESTINE</text>
    </g>

    <text x="82" y="390" class="micro" fill="#526b7f">COMPUTER SCIENCE @ AN-NAJAH NATIONAL UNIVERSITY</text>
    <text x="1358" y="390" text-anchor="end" class="micro" fill="#526b7f">OPEN TO INTERNSHIPS + COLLABORATION</text>
  </g>

  <rect x="1" y="1" width="1438" height="418" rx="28" fill="none" stroke="#9fb2c2" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M28 1H302" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.9"/>
</svg>
