<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Zaid Mayyalleh — Developer Header</title>
  <desc id="desc">A modern animated developer portfolio header for Zaid Mayyalleh.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="48%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#080B16"/>
    </linearGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#67E8F9"/>

      <animate
        attributeName="x1"
        values="0%;15%;0%"
        dur="8s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="x2"
        values="100%;85%;100%"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path
        d="M 42 0 L 0 0 0 42"
        fill="none"
        stroke="#94A3B8"
        stroke-opacity=".055"
        stroke-width="1"
      />
    </pattern>

    <filter id="blur70">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="8"
        result="blur"
      />

      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          1 0 0 0 0.35
          0 1 0 0 0.25
          0 0 1 0 0.90
          0 0 0 .35 0
        "
        result="soft"
      />

      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="20"
        flood-color="#000000"
        flood-opacity=".4"
      />
    </filter>

    <clipPath id="canvasClip">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Background -->
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- Purple animated glow -->
    <circle
      cx="250"
      cy="100"
      r="210"
      fill="url(#purpleGlow)"
      filter="url(#blur70)"
    >
      <animate
        attributeName="cx"
        values="250;320;250"
        dur="14s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cy"
        values="100;145;100"
        dur="11s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Cyan animated glow -->
    <circle
      cx="1020"
      cy="330"
      r="230"
      fill="url(#cyanGlow)"
      filter="url(#blur70)"
    >
      <animate
        attributeName="cx"
        values="1020;930;1020"
        dur="16s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="cy"
        values="330;280;330"
        dur="13s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Small glowing points -->
    <g opacity=".55">
      <circle cx="110" cy="84" r="2" fill="#A78BFA">
        <animate
          attributeName="opacity"
          values=".2;1;.2"
          dur="3.4s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="1090" cy="94" r="2" fill="#67E8F9">
        <animate
          attributeName="opacity"
          values=".15;.85;.15"
          dur="4.1s"
          begin=".8s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="1025" cy="350" r="1.6" fill="#A78BFA">
        <animate
          attributeName="opacity"
          values=".1;.75;.1"
          dur="3.7s"
          begin="1.1s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="180" cy="330" r="1.8" fill="#67E8F9">
        <animate
          attributeName="opacity"
          values=".1;.9;.1"
          dur="4.4s"
          begin=".5s"
          repeatCount="indefinite"
        />
      </circle>
    </g>

    <!-- Available badge -->
    <g transform="translate(86 72)">
      <rect
        x="0"
        y="0"
        width="164"
        height="34"
        rx="17"
        fill="#FFFFFF"
        fill-opacity=".045"
        stroke="#FFFFFF"
        stroke-opacity=".12"
      />

      <circle cx="18" cy="17" r="5" fill="#22C55E">
        <animate
          attributeName="opacity"
          values=".45;1;.45"
          dur="2s"
          repeatCount="indefinite"
        />
      </circle>

      <text
        x="33"
        y="22"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing=".8"
        fill="#CBD5E1"
      >
        AVAILABLE TO BUILD
      </text>
    </g>

    <!-- Main content -->
    <g transform="translate(86 145)">
      <text
        x="0"
        y="0"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#8B5CF6"
      >
        DEVELOPER PORTFOLIO
      </text>

      <text
        x="0"
        y="82"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="70"
        font-weight="800"
        letter-spacing="-2"
        fill="url(#nameGradient)"
        filter="url(#textGlow)"
      >
        ZAID MAYYALLEH
      </text>

      <rect
        x="0"
        y="105"
        width="116"
        height="4"
        rx="2"
        fill="url(#accentGradient)"
      >
        <animate
          attributeName="width"
          values="72;116;72"
          dur="5s"
          repeatCount="indefinite"
        />
      </rect>

      <text
        x="0"
        y="151"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="21"
        font-weight="500"
        fill="#E2E8F0"
      >
        AI Student
      </text>

      <circle cx="117" cy="144" r="3" fill="#475569"/>

      <text
        x="137"
        y="151"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="21"
        font-weight="500"
        fill="#E2E8F0"
      >
        Full-Stack Developer
      </text>

      <circle cx="355" cy="144" r="3" fill="#475569"/>

      <text
        x="375"
        y="151"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="21"
        font-weight="500"
        fill="#E2E8F0"
      >
        Palestine
      </text>

      <text
        x="0"
        y="199"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="16"
        font-weight="400"
        fill="#94A3B8"
      >
        Building useful products with clean code, thoughtful design, and AI.
      </text>
    </g>

    <!-- Terminal card -->
    <g transform="translate(790 95)" filter="url(#cardShadow)">
      <rect
        width="328"
        height="226"
        rx="18"
        fill="#0B1020"
        fill-opacity=".78"
        stroke="#FFFFFF"
        stroke-opacity=".11"
      />

      <rect
        width="328"
        height="43"
        rx="18"
        fill="#FFFFFF"
        fill-opacity=".025"
      />

      <line
        x1="0"
        y1="43"
        x2="328"
        y2="43"
        stroke="#FFFFFF"
        stroke-opacity=".08"
      />

      <circle cx="20" cy="22" r="5" fill="#FF5F57"/>
      <circle cx="38" cy="22" r="5" fill="#FEBC2E"/>
      <circle cx="56" cy="22" r="5" fill="#28C840"/>

      <text
        x="164"
        y="27"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        fill="#64748B"
      >
        zaid@portfolio
      </text>

      <text
        x="22"
        y="76"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#64748B"
      >
        $
      </text>

      <text
        x="42"
        y="76"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#E2E8F0"
      >
        npm run build
      </text>

      <text
        x="22"
        y="108"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#22C55E"
      >
        ✓
      </text>

      <text
        x="43"
        y="108"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#94A3B8"
      >
        Code validated
      </text>

      <text
        x="22"
        y="136"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#22C55E"
      >
        ✓
      </text>

      <text
        x="43"
        y="136"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#94A3B8"
      >
        Production build ready
      </text>

      <text
        x="22"
        y="164"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#22C55E"
      >
        ✓
      </text>

      <text
        x="43"
        y="164"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#94A3B8"
      >
        Deploy successful
      </text>

      <text
        x="22"
        y="198"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#8B5CF6"
      >
        ›
      </text>

      <text
        x="43"
        y="198"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        fill="#67E8F9"
      >
        ready to create_
      </text>

      <rect
        x="176"
        y="186"
        width="8"
        height="15"
        rx="1"
        fill="#67E8F9"
      >
        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="1s"
          repeatCount="indefinite"
        />
      </rect>
    </g>

    <!-- Footer -->
    <g transform="translate(86 365)">
      <rect
        width="1028"
        height="1"
        fill="url(#accentGradient)"
        opacity=".24"
      />

      <text
        x="0"
        y="28"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="12"
        font-weight="500"
        letter-spacing="2.2"
        fill="#64748B"
      >
        LEARN • BUILD • SHIP • REPEAT
      </text>

      <text
        x="1028"
        y="28"
        text-anchor="end"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12"
        fill="#64748B"
      >
        2026
      </text>
    </g>

    <!-- Border -->
    <rect
      x=".5"
      y=".5"
      width="1199"
      height="419"
      rx="23.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity=".09"
    />
  </g>
</svg>
