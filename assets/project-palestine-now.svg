<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Palestine Now</title>
  <desc id="desc">Arabic-first public information product with unified search and a personalized local feed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07130f"/><stop offset="1" stop-color="#09241b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ef2a3"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7ceab0" stroke-opacity=".045"/></pattern>
    <style>
      .overline{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2.1px}.title{font:800 30px 'Segoe UI',Arial,sans-serif;letter-spacing:-.4px}.sub{font:500 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}.micro{font:500 9px Consolas,monospace;letter-spacing:1.2px}.pulse{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="238" rx="20" fill="url(#bg)" stroke="#5ef2a3" stroke-opacity=".22"/>
  <rect x="1" y="1" width="638" height="238" rx="20" fill="url(#grid)"/>
  <path d="M32 34H145" stroke="url(#line)" stroke-width="3"/>
  <text x="32" y="62" class="overline" fill="#67d59c">01 / PUBLIC-INTEREST PRODUCT</text>
  <text x="32" y="113" class="title" fill="#f1fbf6">PALESTINE NOW</text>
  <text x="32" y="143" class="sub" fill="#9ab9a9">ARABIC-FIRST INFORMATION EXPERIENCE</text>
  <text x="32" y="202" class="micro" fill="#5e8370">SEARCH  ·  RTL  ·  ACCESSIBILITY  ·  TRUST</text>
  <g transform="translate(498 119)">
    <circle r="71" fill="#0b2b20" stroke="#5ef2a3" stroke-opacity=".16"/>
    <circle r="48" fill="none" stroke="#2dd4bf" stroke-opacity=".23" stroke-dasharray="5 8"/>
    <path d="M-46 27C-25 2-6-10 21-12M-39 41C-11 15 16 4 48 7M-47-14C-21-35 10-41 43-30" fill="none" stroke="url(#line)" stroke-opacity=".65" stroke-width="2"/>
    <g fill="#5ef2a3" filter="url(#glow)"><circle cx="-46" cy="27" r="4"/><circle cx="21" cy="-12" r="4" class="pulse"/><circle cx="48" cy="7" r="4"/><circle cx="-47" cy="-14" r="4" class="pulse"/><circle cx="43" cy="-30" r="4"/></g>
    <circle r="9" fill="#06150f" stroke="#79ffc0"/><circle r="3" fill="#79ffc0" filter="url(#glow)"/>
  </g>
</svg>
