name: Refresh profile statistics

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_stats.py'
      - 'tests/test_stats.py'
      - '.github/workflows/profile-stats.yml'
  pull_request:
    paths:
      - 'scripts/update_stats.py'
      - 'tests/test_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: read

concurrency:
  group: profile-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test metric definitions and rendering
        run: python3 -m unittest discover -s tests -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Fetch public metrics and render cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py --user zaidmoen
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh public profile statistics'
          git push origin HEAD:main
