name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: Main Stats & Achievements
      - name: Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zaidmoen
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Gaza
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          filename: assets/metrics.base.svg

      # Card 2: Engineering & Languages
      - name: Engineering Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zaidmoen
          template: classic
          base: ""
          config_timezone: Asia/Gaza
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          plugin_lines: yes
          filename: assets/metrics.engineering.svg

      # Card 3: Activity & Habits
      - name: Activity Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zaidmoen
          template: classic
          base: ""
          config_timezone: Asia/Gaza
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          filename: assets/metrics.activity.svg
